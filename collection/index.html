<!doctype html>
<html lang="ja">
<head>

<meta name="description" content="SAMPLE-LPのランディングページを集めたデザインコレクション。NUTORY、パドブル、cocoriを、サムネイル・検索・お気に入りから探せます。">
<meta name="theme-color" content="#f5f4ef"><title>LP Collection — SAMPLE-LP</title>

<style>
:root{--bg:#f5f4ef;--ink:#242c26;--muted:#697069;--line:#dcded5;--accent:#d6ed88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}a{color:inherit;text-decoration:none}button,a,input,select{-webkit-tap-highlight-color:transparent}:focus-visible{outline:3px solid #548341;outline-offset:5px}button{cursor:pointer}header{max-width:1440px;margin:auto;padding:27px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:14px;letter-spacing:.07em}.mark{display:grid;grid-template-columns:repeat(2,6px);gap:3px}.mark i{height:6px;background:var(--ink);border-radius:1px}.header-link{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}.header-link span{color:var(--ink);font-size:18px}main{max-width:1440px;margin:auto;padding:64px 5% 80px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:48px;gap:30px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.19em;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";width:7px;height:7px;background:#7d9655;border-radius:50%}h1{font-size:clamp(48px,6vw,80px);font-weight:500;line-height:1.05;letter-spacing:-.065em;margin:20px 0 23px}h1 em{font-family:Georgia,serif;font-weight:400}.intro p{font-size:13px;line-height:1.9;color:var(--muted);margin:0}.archive-note{text-align:right;flex-shrink:0;padding-bottom:5px}.archive-note strong{display:block;font-size:40px;letter-spacing:-.06em;font-weight:500}.archive-note span{font-size:10px;letter-spacing:.14em;color:var(--muted)}.tools{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs{display:flex;gap:7px;flex-shrink:0}.tab{border:1px solid transparent;border-radius:30px;background:transparent;padding:11px 18px;color:var(--muted);font-size:12px}.tab[aria-pressed=true]{background:var(--ink);color:#fff}.tab span{margin-left:8px;opacity:.65}.search{display:flex;align-items:center;gap:10px;max-width:380px;width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 13px}.search svg{width:17px;flex-shrink:0;color:var(--muted)}.search input{width:100%;min-width:0;border:0;background:transparent;padding:13px 0;font-size:12px;color:var(--ink);outline:none}.search:focus-within{outline:2px solid #548341}.meta{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:26px 0 20px;font-size:11px;color:var(--muted)}.meta p{margin:0}.sort{display:flex;align-items:center;gap:7px}.sort select{background:transparent;border:0;color:var(--ink);font-size:11px;padding:6px;max-width:160px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:38px 28px}.card{min-width:0}.preview{display:block;position:relative;overflow:hidden;border-radius:12px;background:#e7e8df;border:1px solid rgba(36,44,38,.08);aspect-ratio:1.44}.preview img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s}.preview:hover img{transform:scale(1.025)}.preview:after{content:"LPを見る ↗";position:absolute;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:10px 15px;border-radius:30px;font-size:11px;opacity:0;transform:translateY(5px);transition:.2s}.preview:hover:after,.preview:focus-visible:after{opacity:1;transform:translateY(0)}.card-head{display:flex;justify-content:space-between;gap:16px;margin-top:18px;align-items:center}.card h2{font-size:23px;font-weight:550;letter-spacing:-.035em;margin:0}.card h2 small{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:9px}.favorite{width:40px;height:40px;background:transparent;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--ink)}.favorite svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}.favorite[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}.favorite[aria-pressed=true] svg{fill:var(--ink)}.description{font-size:12px;color:var(--muted);line-height:1.8;margin:8px 0 16px}.card-foot{display:flex;justify-content:space-between;gap:15px;align-items:center}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;color:#646d61;border:1px solid var(--line);border-radius:4px;padding:5px 8px}.visit{font-size:11px;white-space:nowrap;border-bottom:1px solid var(--ink);padding:5px 0}.visit span{margin-left:12px}.empty{text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:12px}.empty h2{font-size:20px;font-weight:500}.empty p{font-size:13px;color:var(--muted);line-height:1.8}.reset{border:0;border-radius:30px;background:var(--ink);color:white;padding:12px 20px;font-size:12px;margin-top:10px}[hidden]{display:none!important}.bottom-note{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:24px;margin-top:54px;color:var(--muted);font-size:11px;line-height:1.8}.bottom-note p{margin:0}.bottom-note a{border-bottom:1px solid var(--line)}footer{max-width:1440px;padding:22px 5%;margin:auto;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.08em;color:var(--muted)}.footer-logo{color:var(--ink);font-size:14px;letter-spacing:-.03em}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#notice{font-size:12px;color:#765529;margin:14px 0 0;line-height:1.7}@media(min-width:1600px){main{padding-top:80px}}@media(max-width:700px){header{padding:22px 6%}.header-link{font-size:10px}main{padding:42px 6% 48px}.intro{align-items:start;margin-bottom:32px;gap:15px}h1{font-size:49px;margin:19px 0}.intro p{font-size:12px}.archive-note strong{font-size:28px}.archive-note{padding-top:33px}.archive-note span{font-size:8px}.tools{flex-direction:column;align-items:stretch;gap:16px}.tabs{gap:3px}.tab{padding:10px 15px}.search{max-width:none}.grid{grid-template-columns:1fr;gap:32px}.meta{font-size:10px;gap:8px;margin-top:20px}.sort{gap:0}.sort select{max-width:135px}.card h2{font-size:22px}.bottom-note{flex-direction:column;gap:12px;margin-top:38px}footer{padding:22px 6%}.preview:after{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><a class="brand" href="./" aria-label="LP Collection ホーム"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>SAMPLE-LP</a><a class="header-link" href="https://github.com/kenkenta51-max/SAMPLE-LP" target="_blank" rel="noopener noreferrer">GitHubで見る <span aria-hidden="true">↗</span><span class="sr-only">（新しいタブ）</span></a></header>
<main>
<section class="intro" aria-labelledby="title"><div><div class="eyebrow">A LITTLE LIBRARY OF LANDING PAGES</div><h1 id="title">LP <em>Collection.</em></h1><p>アイデアを、ひとつの場所に。<br>SAMPLE-LPのランディングページを集めました。</p></div><div class="archive-note"><strong>03</strong><span>PAGES / 03 BRANDS</span></div></section>
<section aria-label="LPを探す"><div class="tools"><div class="tabs" role="group" aria-label="表示するコレクション"><button class="tab" id="all" aria-pressed="true">すべて<span>3</span></button><button class="tab" id="saved" aria-pressed="false">お気に入り<span id="saved-count">0</span></button></div><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">ブランド名・キーワードで検索</span><input type="search" id="search" placeholder="ブランド名・キーワードで検索" autocomplete="off"></label></div><p id="notice" role="status" hidden></p><div class="meta"><p id="results" role="status" aria-live="polite" aria-atomic="true"></p><label class="sort">並び順<select id="sort"><option value="default">おすすめ順</option><option value="name">名前順 A → Z</option></select></label></div><div id="grid" class="grid"></div><div class="empty" id="empty" hidden><h2 id="empty-title"></h2><p id="empty-description"></p><button class="reset" id="reset">すべてのLPを見る</button></div><noscript><p>検索とお気に入りにはJavaScriptが必要です。各LPはこちらから開けます。</p><ul><li><a href="../">NUTORY</a></li><li><a href="../padobul/">パドブル</a></li><li><a href="../archive/cocori/">cocori</a></li></ul></noscript></section>
<div class="bottom-note"><p>お気に入りは、このブラウザに保存されます。<br>各LPの「公開ページ」を押すと、新しいタブで開きます。</p><p>各ブランドを1件ずつ掲載。重複するブランチ・納品データはまとめています。<br><a href="https://github.com/kenkenta51-max/SAMPLE-LP/blob/main/collection/README.md" target="_blank" rel="noopener noreferrer">収録ページについて ↗</a></p></div>
</main><footer><span class="footer-logo">A collection worth keeping.</span><span>SAMPLE-LP / COLLECTION</span></footer>
<script>
'use strict';
const pages=[
{id:'nutory',name:'NUTORY',subtitle:'너토리',description:'ピーナッツパウダーの韓国向けLP。浮遊するボトルと、ポップなフードキャンペーン。',tags:['食品・ドリンク','韓国語','現行版'],keywords:'ナトリー ヌトリー ナッツ ピーナッツ peanut powder food orange green オレンジ 緑',url:'../',image:'nutory'},
{id:'padobul',name:'Padobul',subtitle:'パドブル / 파도불',description:'弾ける韓国フードのLP。人物写真と光沢のある背景で、食の楽しさを鮮やかに。',tags:['食品','韓国語','現行版'],keywords:'パドブル パドブール 韓国料理 food enamel 人物 光沢',url:'../padobul/',image:'padobul'},
{id:'cocori',name:'cocori',subtitle:'ココリ',description:'「ひとくち、夏をほどく。」ココナッツの世界観を、涼やかな色と写真で伝えるLP。',tags:['食品・ドリンク','日本語','復元版'],keywords:'ココリ ココナッツ coconut 夏 summer ブルー 青',url:'../archive/cocori/',image:'cocori'}
];
const key='sample-lp-favorites-v1',grid=document.querySelector('#grid'),search=document.querySelector('#search'),sort=document.querySelector('#sort');let favorites=new Set(),onlySaved=false,persistent=true;
function favoriteIds(value){return Array.isArray(value)?value.map(id=>id==='padobul-archive'?'padobul':id).filter(id=>pages.some(p=>p.id===id)):[];}
function warn(){document.querySelector('#notice').hidden=false;document.querySelector('#notice').textContent='ブラウザに保存できないため、お気に入りはこのページを開いている間だけ保持されます。'}
try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))favorites=new Set(favoriteIds(stored));}catch(e){persistent=false;warn();}
const normalize=s=>s.normalize('NFKC').toLocaleLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function render(){const terms=normalize(search.value).trim().split(/\s+/).filter(Boolean);let visible=pages.filter(p=>(!onlySaved||favorites.has(p.id))&&terms.every(t=>normalize([p.name,p.subtitle,p.description,...p.tags,p.keywords].join(' ')).includes(t)));if(sort.value==='name')visible.sort((a,b)=>a.name.localeCompare(b.name,'en')||pages.indexOf(a)-pages.indexOf(b));grid.replaceChildren();for(const p of visible){const card=document.createElement('article');card.className='card';card.dataset.id=p.id;card.innerHTML=`<a class="preview" href="${p.url}" target="_blank" rel="noopener noreferrer" aria-label="${p.name} ${p.subtitle}の公開ページを開く（新しいタブ）"><img src="thumbnails/${p.image}.webp" width="900" height="625" alt="${p.name} ${p.subtitle}のファーストビュー" loading="lazy"></a><div class="card-head"><h2>${p.name}<small>${p.subtitle}</small></h2><button class="favorite" type="button" aria-pressed="${favorites.has(p.id)}" aria-label="${p.name} ${p.subtitle}をお気に入り${favorites.has(p.id)?'から削除':'に追加'}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg></button></div><p class="description">${p.description}</p><div class="card-foot"><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><a class="visit" href="${p.url}" target="_blank" rel="noopener noreferrer">公開ページ<span aria-hidden="true">↗</span><span class="sr-only">：${p.name} ${p.subtitle}（新しいタブ）</span></a></div>`;card.querySelector('.favorite').addEventListener('click',()=>toggle(p.id));grid.append(card);}document.querySelector('#saved-count').textContent=favorites.size;document.querySelector('#results').textContent=`${onlySaved?'お気に入り':'すべてのLP'} — ${visible.length} / ${pages.length} 件`;document.querySelector('#empty').hidden=visible.length>0;document.querySelector('#empty-title').textContent=search.value.trim()?'一致するLPがありません':'お気に入りを集めてみましょう';document.querySelector('#empty-description').textContent=search.value.trim()?'別のブランド名やキーワードで探してみてください。':'カードの星を押すと、ここからいつでも見返せます。';document.querySelector('#all').setAttribute('aria-pressed',String(!onlySaved));document.querySelector('#saved').setAttribute('aria-pressed',String(onlySaved));}
function toggle(id){favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem(key,JSON.stringify([...favorites]));}catch(e){persistent=false;warn();}const oldIndex=[...grid.children].findIndex(n=>n.dataset.id===id);render();const same=grid.querySelector(`[data-id="${id}"] .favorite`);const next=grid.children[Math.min(oldIndex,grid.children.length-1)]?.querySelector('.favorite');(same||next||document.querySelector('#reset')).focus();}
document.querySelector('#all').addEventListener('click',()=>{onlySaved=false;render();});document.querySelector('#saved').addEventListener('click',()=>{onlySaved=true;render();});document.querySelector('#reset').addEventListener('click',()=>{onlySaved=false;search.value='';sort.value='default';render();search.focus();});search.addEventListener('input',render);sort.addEventListener('change',render);window.addEventListener('storage',e=>{if(e.key===key||e.key===null){try{const value=JSON.parse(e.newValue||'[]');favorites=new Set(favoriteIds(value));render();}catch(e){}}});render();
</script>
</body></html>
